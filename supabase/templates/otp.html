<!-- Mail mã 6 số MediPOS (đăng nhập lần đầu / quên mật khẩu). Không có link: chỉ nhập mã trong app.
     Lên thật: dán nội dung này vào Supabase → Authentication → Email Templates → Magic Link (tiêu đề "Mã đăng nhập MediPOS"). -->
<!doctype html>
<html lang="vi">
<body style="margin:0;padding:0;background:#f1f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1f2a2a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f4;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:32px 28px">
        <tr><td style="font-size:20px;font-weight:700;color:#0f766e;padding-bottom:20px">MediPOS</td></tr>
        <tr><td style="font-size:16px;line-height:24px;padding-bottom:16px">Mã xác minh của bạn:</td></tr>
        <tr><td align="center" style="padding:8px 0 20px">
          <div style="display:inline-block;font-size:34px;font-weight:700;letter-spacing:10px;color:#0f172a;background:#f0fdfa;border-radius:12px;padding:14px 22px 14px 32px">{{ .Token }}</div>
        </td></tr>
        <tr><td style="font-size:14px;line-height:22px;color:#475569">Nhập mã này trong app MediPOS. Mã có hiệu lực 10 phút.</td></tr>
        <tr><td style="font-size:14px;line-height:22px;color:#475569;padding-top:12px">Không chia sẻ mã cho bất kỳ ai. Nếu bạn không yêu cầu mã, hãy bỏ qua mail này.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
